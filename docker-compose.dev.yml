services:
  hell-llex-bot:
    image: hellllex/hell-llex-bot:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hell-llex-bot-dev
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH}:/vault
      - ./:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
